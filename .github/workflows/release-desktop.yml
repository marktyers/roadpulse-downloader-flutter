name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS application
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/roadpulse_downloader.app RoadPulse-Downloader-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RoadPulse-Downloader-macOS
          path: RoadPulse-Downloader-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows application
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath RoadPulse-Downloader-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RoadPulse-Downloader-Windows
          path: RoadPulse-Downloader-Windows.zip

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: RoadPulse-Downloader-*
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
